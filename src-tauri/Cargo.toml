[package]
name = "fily"
version = "0.2.0"
description = "Fily — modern file manager"
authors = ["Fily"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
trash = "3"
mime_guess = "2"
sha2 = "0.10"
dirs = "5"
chrono = "0.4"
base64 = "0.22"
zip = "2"
tar = "0.4"
flate2 = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
